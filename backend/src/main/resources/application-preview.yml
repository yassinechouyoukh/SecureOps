spring:
  datasource:
    url: jdbc:h2:mem:secureops-preview;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway.enabled: false
  sql.init.mode: always
  sql.init.schema-locations: classpath:preview-schema.sql
server.servlet.session.cookie.secure: false
